name: Pipeline CI/CD
on: 
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalçao das dependencias
        run: npm install
        
      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{vars.TMDB_API_URL}}
          TMDB_API_KEY: ${{secrets.TMDB_API_KEY}}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{vars.NEXT_PUBLIC_TMDB_API_IMG_URL}}
